name: CoCompose Windows
on:
  workflow_dispatch:
  push:
    branches: [ai-editor]
    paths:
      - 'examples/**'
      - 'modules/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/cocompose-windows.yml'
  pull_request:
    branches: [ai-editor]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and package executable
        shell: pwsh
        run: ./tools/build-windows.ps1

      - name: Unpack the distribution
        shell: pwsh
        run: |
          $zip = Get-ChildItem build-cocompose/dist/CoCompose-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath build-cocompose/unpacked -Force
          if (-not (Test-Path build-cocompose/unpacked/CoCompose.exe)) { throw "No CoCompose.exe in the ZIP" }

      # The runner has no audio device, so the app opens a null device. That is enough
      # for the model, the work surface, the file protocol and rendering, which is what
      # these checks cover. Anything that needs a real device or a third-party plugin is
      # not run here and is not claimed as verified.
      - name: Check the packaged executable
        shell: pwsh
        run: |
          python tools/test_live_sync.py --exe build-cocompose/unpacked/CoCompose.exe --output build-cocompose/ci-check
          if ($LASTEXITCODE -ne 0) { throw "Integration checks failed" }

      - name: Check it starts like a double-click
        shell: pwsh
        run: ./tools/test_portable_start.ps1 -Exe (Resolve-Path build-cocompose/unpacked/CoCompose.exe)

      # Installing, replacing the install with another copy, and removing it again.
      # What has to survive the middle step is the work, which lives outside the
      # installed folder; what has to survive the last one is the same.
      - name: Check installing, updating and removing
        shell: pwsh
        run: ./tools/test_install_and_update.ps1 -Unpacked (Resolve-Path build-cocompose/unpacked)

      # Only now, with every check passed, does the distribution get its report and
      # its hash. The hash is of the file people would actually download.
      - name: Seal the distribution
        shell: pwsh
        run: |
          $zip = Get-ChildItem build-cocompose/dist/CoCompose-*-windows-x64.zip | Select-Object -First 1
          ./tools/finish_release.ps1 -Zip $zip.FullName `
                                     -Report build-cocompose/ci-check/test-report.json `
                                     -Extra docs/release.ko.md, docs/compatibility-2026-09-10.ko.md

      - name: Collect the check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CoCompose-check-report
          path: |
            build-cocompose/ci-check/test-report.json
            build-cocompose/ci-check/**/ui.png
            build-cocompose/ci-check/**/sync-status.json
          if-no-files-found: warn

      # Only reached when the checks above passed, so a broken build is never published.
      - uses: actions/upload-artifact@v4
        with:
          name: CoCompose-windows-x64
          path: |
            build-cocompose/dist/CoCompose-*-windows-x64.zip
            build-cocompose/dist/SHA256SUMS.txt
          if-no-files-found: error
